<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Обмен</title>
<link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
<div class="login-card">
  <div class="brand login-brand">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8"/><path d="m3 8 2.4-4.2A2 2 0 0 1 7.1 3h9.8a2 2 0 0 1 1.7.8L21 8Z"/><path d="M3 8h18"/><path d="M12 12v6"/><path d="m9 15 3 3 3-3"/></svg>
    </div>
    <div>
      <div class="brand-name">Обмен</div>
      <div class="brand-sub">файлы офиса</div>
    </div>
  </div>

  <div class="login-tabs" role="tablist">
    <button class="login-tab active" id="tabLogin" role="tab" aria-selected="true">Вход</button>
    <button class="login-tab" id="tabRegister" role="tab" aria-selected="false">Регистрация</button>
  </div>

  <form id="formLogin" autocomplete="on">
    <label class="field">
      <span>Ник</span>
      <input type="text" id="loginUser" maxlength="40" autocomplete="username" required>
    </label>
    <label class="field">
      <span>Пароль</span>
      <input type="password" id="loginPass" autocomplete="current-password" required>
    </label>
    <button class="btn-primary login-submit" type="submit" id="loginSubmit">Войти</button>
  </form>

  <form id="formRegister" hidden autocomplete="on">
    <label class="field">
      <span>Ник</span>
      <input type="text" id="regUser" maxlength="40" autocomplete="username" placeholder="Например, Анна Смирнова">
    </label>
    <label class="field">
      <span>Пароль (минимум 6 символов)</span>
      <input type="password" id="regPass" autocomplete="new-password" minlength="6">
    </label>
    <label class="field">
      <span>Пароль-приглашение <em>(спросите у коллег)</em></span>
      <input type="password" id="regInvite" autocomplete="off">
    </label>
    <button class="btn-primary login-submit" type="submit" id="regSubmit">Создать аккаунт</button>
  </form>

  <p class="login-error" id="loginError" role="alert" hidden></p>
  <p class="login-hint">Ник привязывается к вашим файлам — никто не сможет выдать себя за вас или удалить чужой файл.</p>
</div>

<script>
(function () {
  'use strict';
  var tabLogin = document.getElementById('tabLogin');
  var tabRegister = document.getElementById('tabRegister');
  var formLogin = document.getElementById('formLogin');
  var formRegister = document.getElementById('formRegister');
  var errBox = document.getElementById('loginError');

  function showErr(msg) {
    errBox.textContent = msg;
    errBox.hidden = !msg;
  }

  function switchTab(login) {
    tabLogin.classList.toggle('active', login);
    tabRegister.classList.toggle('active', !login);
    tabLogin.setAttribute('aria-selected', String(login));
    tabRegister.setAttribute('aria-selected', String(!login));
    formLogin.hidden = !login;
    formRegister.hidden = login;
    showErr('');
    (login ? document.getElementById('loginUser') : document.getElementById('regUser')).focus();
  }
  tabLogin.addEventListener('click', function () { switchTab(true); });
  tabRegister.addEventListener('click', function () { switchTab(false); });

  function submit(url, payload, btn) {
    btn.disabled = true;
    showErr('');
    fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json; charset=utf-8' },
      body: JSON.stringify(payload),
      credentials: 'same-origin'
    }).then(function (r) {
      return r.json().then(function (d) { return { status: r.status, data: d }; });
    }).then(function (res) {
      if (res.status === 200 && res.data.ok) {
        try { sessionStorage.setItem('obmen_csrf', res.data.csrf || ''); } catch (e) {}
        location.href = '/';
        return;
      }
      showErr(res.data.error || 'Ошибка (' + res.status + ')');
      btn.disabled = false;
    }).catch(function () {
      showErr('Сеть недоступна. Проверьте, что сервер запущен.');
      btn.disabled = false;
    });
  }

  formLogin.addEventListener('submit', function (e) {
    e.preventDefault();
    submit('/api/login', {
      username: document.getElementById('loginUser').value.trim(),
      password: document.getElementById('loginPass').value
    }, document.getElementById('loginSubmit'));
  });

  formRegister.addEventListener('submit', function (e) {
    e.preventDefault();
    var u = document.getElementById('regUser').value.trim();
    var p = document.getElementById('regPass').value;
    if (u.length < 2) { showErr('Ник — минимум 2 символа'); return; }
    if (p.length < 6) { showErr('Пароль — минимум 6 символов'); return; }
    submit('/api/register', {
      username: u, password: p,
      invite: document.getElementById('regInvite').value
    }, document.getElementById('regSubmit'));
  });

  // уже вошли — сразу в приложение
  fetch('/api/me', { credentials: 'same-origin' }).then(function (r) {
    if (r.ok) location.href = '/';
  }).catch(function () {});
})();
</script>
</body>
</html>
