<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Обмен</title>
<link rel="stylesheet" href="styles.css">
<style>
  .login-wrap { min-height: 100dvh; display: grid; place-items: center; padding: 20px; }
  .login-card {
    width: 100%; max-width: 360px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px;
    box-shadow: var(--shadow); text-align: center;
    animation: pop-in 180ms ease;
  }
  .login-mark {
    width: 48px; height: 48px; border-radius: 14px; margin: 0 auto 14px;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center;
  }
  .login-mark svg { width: 26px; height: 26px; }
  .login-card h1 { margin: 0 0 6px; font-size: 20px; font-weight: 800; }
  .login-card p { margin: 0 0 18px; color: var(--text-muted); font-size: 13.5px; }
  .login-card input {
    width: 100%; height: 44px; border-radius: 10px; text-align: center;
    border: 1px solid var(--border); background: var(--bg);
    padding: 0 12px; outline: none; margin-bottom: 12px; font-size: 15px;
    transition: border-color 150ms ease;
  }
  .login-card input:focus { border-color: var(--accent); }
  .login-card .btn-primary { width: 100%; justify-content: center; height: 44px; }
  .login-error { color: var(--danger); font-size: 13px; font-weight: 600; min-height: 20px; margin-bottom: 4px; }
  .shake { animation: shake 300ms ease; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
</style>
</head>
<body>
<div class="login-wrap">
  <form class="login-card" id="loginForm">
    <div class="login-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
    </div>
    <h1>Обмен</h1>
    <p>Файлы офиса. Введите пароль, который сообщил администратор.</p>
    <div class="login-error" id="loginError"></div>
    <input type="password" id="pwInput" placeholder="Пароль" autocomplete="current-password" autofocus>
    <button type="submit" class="btn-primary" id="loginBtn">Войти</button>
  </form>
</div>
<script>
(function () {
  var form = document.getElementById('loginForm');
  var input = document.getElementById('pwInput');
  var err = document.getElementById('loginError');
  var btn = document.getElementById('loginBtn');
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    try {
      var r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: input.value })
      });
      if (r.ok) { location.href = '/'; return; }
      var d = await r.json().catch(function () { return {}; });
      err.textContent = d.error || 'Ошибка входа';
      form.classList.remove('shake'); void form.offsetWidth; form.classList.add('shake');
      input.select();
    } catch {
      err.textContent = 'Сервер недоступен';
    } finally {
      btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
